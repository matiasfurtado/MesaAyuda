<!DOCTYPE html>
<!-- resetPassword.html - Cambio de password - Mesa de Ayuda -->
<html Lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Cambio de contraseña</title>
    <style type="text/css">
        label { font-size: 18px; }
        form { width: 500px; border: 1px solid black; }
        input { margin: 7px; padding: 2px }
        .form-label { margin-bottom: 0!important; }
        .txt { display: inline-block; width: 80%; outline: none; margin: 0; }
    </style>
</head>
<body>
    <center><img src="HelpDeskGirl.png" alt="Nuestra imagen corporativa" style="width:200px;height:150px;"></center>
    <center>
        <h1>Sistema de Mesa de Ayuda</h1>
        <h2>Cambio de contraseña</h2>
    </center>

    <center>
    <form class="form" method="GET" style="background-color:#d8f7cf">
        <br>
        <table>
            <tr><td><label class="form-label">E-mail</label></td></tr>
            <tr><td><input class="txt" name="contacto" type="email" placeholder="Correo electrónico del cliente"><br></td></tr>
            <tr><td>&nbsp;</td></tr>
            <tr><td><label class="form-label">Nueva contraseña</label></td></tr>
            <tr><td><input class="txt" name="password" type="password" placeholder="Nueva contraseña"><br></td></tr>
            <tr><td>&nbsp;</td></tr>
            <tr><td><label class="form-label">Repita la nueva contraseña</label></td></tr>
            <tr><td><input class="txt" name="password2" type="password" placeholder="Repita la nueva contraseña"><br></td></tr>
            <tr><td><span id="resultado1"></span></td></tr>
        </table>
        <button type="submit">Cambiar contraseña</button>
        <p><a href="loginClient.html">Volver al login</a></p>
    </form>
    </center>

    <script src="resetPassword.js" type="module"></script>
    <div style="text-align: center; margin-top: 20px;">
    <button type="button"
        onclick="window.location.href='http://127.0.0.1:5500/MesaAyuda1/HTML/loginClient.html'">
        Volver al inicio de sesión
    </button>
</div>
</body>
</html>
