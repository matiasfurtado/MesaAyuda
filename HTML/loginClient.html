<!DOCTYPE html>
<!--
loginClient.html
Taller de maquetado - aplicación ejemplo Mesa de Ayuda
UADER - Ingeniería de Software I
-->

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Mesa de Ayuda - Iniciar sesión</title>

    <style type="text/css">
        label {
            font-size: 18px;
        }

        form {
            width: 500px;
            border: 1px solid black;
        }

        input {
            margin: 7px;
            padding: 2px;
        }

        .form-label {
            margin-bottom: 0 !important;
        }

        .txt {
            display: inline-block;
            width: 80%;
            outline: none;
            margin: 0;
        }
    </style>
</head>

<body>

    <!-- Área de encabezados fijos -->
    <center>
        <img src="HelpDeskGirl.png"
             alt="Nuestra imagen corporativa"
             style="width:200px;height:150px;">
    </center>

    <center>
        <h1>Sistema de Mesa de Ayuda</h1>
        <h2>Iniciar sesión</h2>
    </center>

    <!-- Formulario para enviar los datos -->
    <center>
        <form class="form"
              method="GET"
              autocomplete="off"
              style="background-color:#d8f7cf"
              width="100px"
              border="1">

            <br>

            <table>
                <tr style="height:10px;">
                    <td>
                        <label for="cliForm" class="form-label">
                            E-mail
                        </label>
                    </td>
                </tr>

                <tr style="height:10px;">
                    <td>
                        <input class="txt"
                               id="cliForm"
                               name="contacto"
                               type="email"
                               placeholder="Correo electrónico del usuario"
                               autocomplete="off"
                               value="">
                        <br>
                    </td>
                </tr>

                <tr>
                    <td>&nbsp;</td>
                </tr>

                <tr style="height:10px;">
                    <td>
                        <label for="passForm" class="form-label">
                            Contraseña
                        </label>
                    </td>
                </tr>

                <tr>
                    <td>
                        <input class="txt"
                               id="passForm"
                               name="password"
                               type="password"
                               placeholder="Contraseña"
                               autocomplete="off"
                               value="">
                        <br>
                    </td>
                </tr>

                <tr>
                    <td>
                        <span id="resultado1"></span>
                    </td>
                </tr>

                <tr>
                    <td><br></td>
                </tr>

                <tr>
                    <td>
                        <center>
                            <a id="linkOlvido" href="resetPassword.html">
                                ¿Olvidaste tu contraseña?
                            </a>
                        </center>
                    </td>
                </tr>

                <tr>
                    <td>
                        <center>
                            <span>¿No tienes una cuenta?</span>
                            <a id="linkRegistro"
                               href="registrarCliente.html">
                                Registrate
                            </a>
                        </center>
                    </td>
                </tr>

                <tr>
                    <td>
                        <br>
                        <input name="termscondition" type="checkbox">
                        Acepto los términos y condiciones del ingreso
                        al sistema (S.E.u.O)
                    </td>
                </tr>

                <tr>
                    <td>
                        <span id="resultado2"></span>
                    </td>
                </tr>
            </table>

            <button type="submit">
                Ingresar
            </button>

            <p></p>

        </form>

        <p>
            ¡Todo lo que Ud. diga o haga en éste sistema
            podrá ser usado en su contra!
        </p>
    </center>

    <!-- Área para crear contenido dinámico -->
    <div id="app"></div>
    <ul id="listado"></ul>

    <!-- Script a ser ejecutado -->
    <script src="loginClient.js" type="module"></script>

</body>
</html>
